      - list [ref=e99]:
        - listitem [ref=e100]: • Leadership exits with one PMF gate (invest / hold / narrow) and a date to re-evaluate.
        - listitem [ref=e101]: • At least one low-quality segment is deprioritized to protect focus.
        - listitem [ref=e102]: • Next-cycle budget is tied to an explicit retention threshold rather than top-line growth alone.
