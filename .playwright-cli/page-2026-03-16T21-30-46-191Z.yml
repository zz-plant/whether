    - generic [ref=e47]:
      - heading "PMF Toolkit" [level=1] [ref=e48]
      - paragraph [ref=e49]: "Decide now: Choose one gate now: invest, hold, or narrow to one segment."
      - paragraph [ref=e50]: "When to use: Use this when you need demand proof before adding cost or complexity."
      - paragraph [ref=e51]: "Operating outcome: A go/hold decision backed by retention quality, not just topline excitement."
      - paragraph [ref=e52]: "Typical runtime: 60-90 minutes with Product + Growth + Finance."
      - paragraph [ref=e53]: "Artifact you leave with: 30-day PMF action memo with gate, threshold, and next review date."
    - generic [ref=e54]:
      - heading "Bounded operating rules" [level=2] [ref=e55]
      - list [ref=e56]:
        - listitem [ref=e57]: "• Tighten: In Safety Mode, tighten spend until retention quality is proven by segment."
        - listitem [ref=e58]: "• Loosen: In Risk-On, loosen channel expansion only for segments with repeat usage."
        - listitem [ref=e59]: "• Proceed threshold: Proceed when core-value retention crosses your agreed PMF threshold for two cohorts."
        - listitem [ref=e60]: "• Stop trigger: Stop incremental acquisition spend when repeat usage drops below the agreed floor."
        - listitem [ref=e61]: "• Reversal trigger: Reverse from invest back to hold if two consecutive cohorts lose retention quality."
      - paragraph [ref=e62]: "Posture split: In Safety Mode, focus on retention proof; in Risk-On, push for repeatable growth."
      - paragraph [ref=e63]: "Who should run it: Product lead, Growth lead, Finance partner, and the team owning activation/retention."
    - generic [ref=e64]:
      - heading "Prep checklist" [level=2] [ref=e65]
      - list [ref=e66]:
        - listitem [ref=e67]: • Bring the latest 2-3 cohorts with activation and retention broken out by segment.
        - listitem [ref=e68]: • Pull paid vs organic acquisition split so the room can separate demand from spend effects.
        - listitem [ref=e69]: • Collect 5 recent churn and 5 retained-user interviews for qualitative context.
    - generic [ref=e70]:
      - heading "Run sequence" [level=2] [ref=e71]
      - list [ref=e72]:
        - listitem [ref=e73]:
          - paragraph [ref=e74]: Collect
          - paragraph [ref=e75]: "Objective: Ground the discussion in observable behavior from the last 2-3 cohorts."
          - paragraph [ref=e76]: Prompts
          - list [ref=e77]:
            - listitem [ref=e78]: • What percentage of users return in the behavior window that maps to core value?
            - listitem [ref=e79]: • Which cohort improved naturally versus through one-off interventions?
          - paragraph [ref=e80]: "Deliverable: One-page PMF evidence sheet with cohort trend highlights."
        - listitem [ref=e81]:
          - paragraph [ref=e82]: Stress-test
          - paragraph [ref=e83]: "Objective: Separate demand quality from channel spend or novelty effects."
          - paragraph [ref=e84]: Prompts
          - list [ref=e85]:
            - listitem [ref=e86]: • If acquisition spend stopped this week, where would active usage settle?
            - listitem [ref=e87]: • Which segments show repeat behavior without high-touch support?
          - paragraph [ref=e88]: "Deliverable: Cohort quality score with confidence notes and known blind spots."
        - listitem [ref=e89]:
          - paragraph [ref=e90]: Decide
          - paragraph [ref=e91]: "Objective: Convert evidence into a specific investment gate."
          - paragraph [ref=e92]: Prompts
          - list [ref=e93]:
            - listitem [ref=e94]: • What threshold upgrades this from hold to scale?
            - listitem [ref=e95]: • What do we stop funding until that threshold is met?
          - paragraph [ref=e96]: "Deliverable: 30-day PMF action memo: invest, hold, or narrow segment."
    - generic [ref=e97]:
