<title id="light-operating-rules-title">Five area operating rules</title>
<desc id="light-operating-rules-desc">Blank operating rule template covering the five canonical areas: Hiring, Roadmap, Fundraising, Spending and New bets. Each row has placeholders for action, pause line and resume line. No advice or current reading is prefilled.</desc>
