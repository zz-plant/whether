<svg xmlns="http://www.w3.org/2000/svg" width="560" height="144" viewBox="0 0 560 144" role="img" aria-labelledby="light-status-cached-title light-status-cached-desc">
<title id="light-status-cached-title">Cached snapshot label</title>
<desc id="light-status-cached-desc">Cached snapshot status label template, shown in neutral ink. The caveat diamond qualifies cached and historical states; no current source health is asserted.</desc>
<g font-family="Archivo, Arial, sans-serif" font-variant-numeric="tabular-nums">
<rect width="100%" height="100%" fill="#f1f4f3"/>
<rect x="1" y="1" width="558" height="142" rx="2" fill="#ffffff" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><rect x="32" y="43" width="12" height="12" transform="rotate(45 38 49)" fill="none" stroke="#121719" stroke-width="2"/><text x="62" y="60" font-size="30" font-weight="600" fill="#121719" text-anchor="start">Cached snapshot</text><text x="28" y="113" font-size="20" font-weight="400" fill="#525c60" text-anchor="start">Status label template</text>
</g>
</svg>
