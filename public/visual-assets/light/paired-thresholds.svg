<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="light-paired-thresholds-title light-paired-thresholds-desc">
<title id="light-paired-thresholds-title">Two thresholds with the same orientation</title>
<desc id="light-paired-thresholds-desc">Illustrative paired threshold template on 0–100 scales. Funding pressure rises toward trouble: example 72, pause above 70, resume below 60. Risk appetite falls toward trouble: example 50, pause below 35, resume above 45. The lower scale is visibly reversed, so trouble sits on the right in both rows.</desc>
