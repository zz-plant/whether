" font-size="26" font-weight="400" fill="#384145" text-anchor="start">Illustrative rules · pressure rises; appetite falls.</text><line x1="64" y1="920" x2="1136" y2="920" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="64" y="961" font-size="20" font-weight="400" fill="#525c60" text-anchor="start">Both scales show 0–100; each keeps its own pause and resume lines.</text><text x="1136" y="961" font-size="20" font-weight="400" fill="#525c60" text-anchor="end">whether.work</text>
