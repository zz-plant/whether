<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="light-decision-delta-title light-decision-delta-desc">
<title id="light-decision-delta-title">Decision change comparison</title>
<desc id="light-decision-delta-desc">Blank decision delta template comparing a previous action and this week's action, with explicit placeholders for the reason and the reversal condition. It contains no current facts.</desc>
<g font-family="Archivo, Arial, sans-serif" font-variant-numeric="tabular-nums">
<rect width="100%" height="100%" fill="#f1f4f3"/>
<text x="64" y="64" font-size="28" font-weight="700" fill="#121719" text-anchor="start">Whether</text><text x="1136" y="64" font-size="22" font-weight="400" fill="#525c60" text-anchor="end">Template</text><text x="64" y="139" font-size="48" font-weight="700" fill="#121719" text-anchor="start">What changed in the decision</text><text x="64" y="184" font-size="24" font-weight="400" fill="#525c60" text-anchor="start">Illustrative template · no current reading</text><text x="80" y="269" font-size="25" font-weight="400" fill="#525c60" text-anchor="start">Previous action</text><text x="650" y="269" font-size="25" font-weight="400" fill="#525c60" text-anchor="start">This week’s action</text><text x="80" y="342" font-size="42" font-weight="600" fill="#121719" text-anchor="start">[Previous action]</text><text x="650" y="342" font-size="42" font-weight="600" fill="#121719" text-anchor="start">[New action]</text><line x1="595" y1="243" x2="595" y2="430" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><line x1="80" y1="445" x2="1120" y2="445" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="80" y="504" font-size="24" font-weight="400" fill="#525c60" text-anchor="start">Reason for the change</text><text x="80" y="551" font-size="29" font-weight="400" fill="#384145" text-anchor="start">[The signal or company constraint that changed]</text><text x="80" y="627" font-size="24" font-weight="400" fill="#525c60" text-anchor="start">Revisit when</text><text x="80" y="674" font-size="29" font-weight="400" fill="#384145" text-anchor="start">[The condition that would reverse this action]</text><line x1="64" y1="770" x2="1136" y2="770" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="64" y="811" font-size="20" font-weight="400" fill="#525c60" text-anchor="start">Replace placeholders with a cited reading before sharing.</text><text x="1136" y="811" font-size="20" font-weight="400" fill="#525c60" text-anchor="end">whether.work</text>
</g>
</svg>
