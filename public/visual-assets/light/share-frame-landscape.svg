<title id="light-share-frame-landscape-title">Landscape share frame</title>
<desc id="light-share-frame-landscape-desc">Blank landscape share template with editable placeholders for the weekly call, decision delta, action, pause condition, resume condition and source note. It contains no current recommendation.</desc>
