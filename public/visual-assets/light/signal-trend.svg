<rect width="100%" height="100%" fill="#f1f4f3"/>
<text x="64" y="64" font-size="28" font-weight="700" fill="#121719" text-anchor="start">Whether</text><text x="1136" y="64" font-size="22" font-weight="400" fill="#525c60" text-anchor="end">Template</text><text x="64" y="139" font-size="48" font-weight="700" fill="#121719" text-anchor="start">A reading against an agreed line</text><text x="64" y="184" font-size="24" font-weight="400" fill="#525c60" text-anchor="start">Illustrative template · no current reading</text><line x1="140" y1="635" x2="1040" y2="635" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="115" y="642" font-size="20" font-weight="400" fill="#525c60" text-anchor="end">0</text><line x1="140" y1="540" x2="1040" y2="540" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="115" y="547" font-size="20" font-weight="400" fill="#525c60" text-anchor="end">25</text><line x1="140" y1="445" x2="1040" y2="445" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="115" y="452" font-size="20" font-weight="400" fill="#525c60" text-anchor="end">50</text><line x1="140" y1="350" x2="1040" y2="350" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="115" y="357" font-size="20" font-weight="400" fill="#525c60" text-anchor="end">75</text><line x1="140" y1="255" x2="1040" y2="255" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="115" y="262" font-size="20" font-weight="400" fill="#525c60" text-anchor="end">100</text><line x1="140" y1="369" x2="1040" y2="369" stroke="#d13b37" stroke-width="2" stroke-dasharray="8 8"/><text x="1040" y="352" font-size="24" font-weight="600" fill="#b4232a" text-anchor="end">Illustrative pause line 70</text><polyline points="140,551.4 320,517.2 500,528.6 680,448.8 860,403.20000000000005 1040,350" fill="none" stroke="#121719" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="551.4" r="6" fill="#121719"/><text x="140" y="674" font-size="22" font-weight="400" fill="#525c60" text-anchor="middle">W1</text><circle cx="320" cy="517.2" r="6" fill="#121719"/><text x="320" y="674" font-size="22" font-weight="400" fill="#525c60" text-anchor="middle">W2</text><circle cx="500" cy="528.6" r="6" fill="#121719"/><text x="500" y="674" font-size="22" font-weight="400" fill="#525c60" text-anchor="middle">W3</text><circle cx="680" cy="448.8" r="6" fill="#121719"/><text x="680" y="674" font-size="22" font-weight="400" fill="#525c60" text-anchor="middle">W4</text><circle cx="860" cy="403.20000000000005" r="6" fill="#121719"/><text x="860" y="674" font-size="22" font-weight="400" fill="#525c60" text-anchor="middle">W5</text><circle cx="1040" cy="350" r="6" fill="#121719"/><text x="1040" y="674" font-size="22" font-weight="400" fill="#525c60" text-anchor="middle">W6</text><text x="140" y="729" font-size="25" font-weight="400" fill="#384145" text-anchor="start">Score domain 0–100 · six fictional readings</text><line x1="64" y1="795" x2="1136" y2="795" stroke="rgba(18, 23, 25, 0.10)" stroke-width="2"/><text x="64" y="836" font-size="20" font-weight="400" fill="#525c60" text-anchor="start">Illustrative example only; retain the domain and source when replacing it.</text><text x="1136" y="836" font-size="20" font-weight="400" fill="#525c60" text-anchor="end">whether.work</text>
