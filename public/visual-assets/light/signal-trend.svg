<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-labelledby="light-signal-trend-title light-signal-trend-desc">
<title id="light-signal-trend-title">Signal trend with threshold</title>
<desc id="light-signal-trend-desc">Illustrative trend template on a labeled 0–100 score domain with six fictional readings: 22, 31, 28, 49, 61 and 75. A dashed pause line sits at 70. This is not a measured time series or current guidance.</desc>
