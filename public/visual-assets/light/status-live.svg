<rect x="1" y="1" width="558" height="142" rx="2" fill="#f8fafc" stroke="rgba(15, 20, 25, 0.16)" stroke-width="2"/><text x="28" y="60" font-size="30" font-weight="600" fill="#0f1419" text-anchor="start">All sources live</text><text x="28" y="113" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">Status label template</text>
</g>
