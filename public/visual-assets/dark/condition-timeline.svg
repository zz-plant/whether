<title id="dark-condition-timeline-title">Condition timeline template</title>
<desc id="dark-condition-timeline-desc">Illustrative timeline template with six fictional equal-width weeks: Freezing, Cloudy, Cloudy, Stormy, Sunny and Sunny. Weather glyphs and words accompany every color. It is not an archive or a current forecast.</desc>
