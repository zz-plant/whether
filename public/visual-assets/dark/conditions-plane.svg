<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="dark-conditions-plane-title dark-conditions-plane-desc">
<title id="dark-conditions-plane-title">Four condition plane</title>
<desc id="dark-conditions-plane-desc">Condition reference template. Funding pressure increases to the right and risk appetite increases upward. Sunny is cheap money with willing investors; Cloudy is pricey money with willing investors; Stormy is cheap money with wary investors; Freezing is pricey money with wary investors. No current reading is plotted.</desc>
<g font-family="Archivo, Arial, sans-serif" font-variant-numeric="tabular-nums">
<rect width="100%" height="100%" fill="#0f1316"/>
