-weight="700" fill="#d6b98a" text-anchor="start">Cloudy</text><text x="740" y="378" font-size="26" font-weight="400" fill="#cdd3d1" text-anchor="start">Money is available but pricey.</text><rect x="100" y="520" width="600" height="280" fill="#8f96e0" fill-opacity="0.09"/><svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#b9bfff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cloud-lightning shrink-0 text-[color:var(--regime-ink)]" data-regime="VOLATILE" data-concept-icon="condition" aria-hidden="true" focusable="false" x="140" y="560"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"></path><path d="m13 12-3 5h4l-3 5"></path></svg><text x="206" y="596" font-size="42" font-weight="700" fill="#b9bfff" text-anchor="start">Stormy</text><text x="140" y="658" font-size="26" font-weight="400" fill="#cdd3d1" text-anchor="start">Money is cheap but investors are</text><text x="140" y="694.4" font-size="26" font-weight="400" fill="#cdd3d1" text-anchor="start">wary.</text><rect x="700" y="520" width="600" height="280" fill="#3a6fa3" fill-opacity="0.09"/><svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#8cc0ec" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-snowflake shrink-0 text-[color:var(--regime-ink)]" data-regime="SCARCITY" data-concept-icon="condition" aria-hidden="true" focusable="false" x="740" y="560"><path d="m10 20-1.25-2.5L6 18"></path><path d="M10 4 8.75 6.5 6 6"></path><path d="m14 20 1.25-2.5L18 18"></path><path d="m14 4 1.25 2.5L18 6"></path><path d="m17 21-3-6h-4"></path><path d="m17 3-3 6 1.5 3"></path><path d="M2 12h6.5L10 9"></path><path d="m20 10-1.5 2 1.5 2"></path><path d="M22 12h-6.5L14 15"></path><path d="m4 10 1.5 2L4 14"></path><path d="m7 21 3-6-1.5-3"></path><path d="m7 3 3 6h4"></path></svg><text x="806" y="596" font-size="42" font-weight="700" fill="#8cc0ec" text-anchor="start">Freezing</text><text x="740" y="658" font-size="26" font-weight="400" fill="#cdd3d1" text-anchor="start">Money is expensive and hard to</text><text x="740" y="694.4" font-size="26" font-weight="400" fill="#cdd3d1" text-anchor="start">raise.</text><line x1="700" y1="240" x2="700" y2="800" stroke="#a0a9a7" stroke-width="2" stroke-dasharray="8 8"/><line x1="100" y1="520" x2="1300" y2="520" stroke="#a0a9a7" stroke-width="2" stroke-dasharray="8 8"/><text x="100" y="225" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">Willing investors</text><text x="100" y="830" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">Wary investors</text><text x="100" y="874" font-size="22" font-weight="400" fill="#cdd3d1" text-anchor="start">Cheap money</text><text x="1300" y="874" font-size="22" font-weight="400" fill="#cdd3d1" text-anchor="end">Pricey money</text><text x="700" y="913" font-size="26" font-weight="600" fill="#edf0ee" text-anchor="middle">Funding pressure →</text><text x="45" y="520" transform="rotate(-90 45 520)" text-anchor="middle" font-size="24" fill="#edf0ee">Risk appetite →</text><line x1="64" y1="960" x2="1336" y2="960" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="64" y="1001" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">Quadrant reference; published calls also require persistence.</text><text x="1336" y="1001" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="end">whether.work</text>
