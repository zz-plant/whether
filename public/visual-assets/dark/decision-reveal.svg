<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="dark-decision-reveal-title dark-decision-reveal-desc">
<title id="dark-decision-reveal-title">Decision reveal end state</title>
<desc id="dark-decision-reveal-desc">Static end state for the motion template, with placeholders for a bounded action and its reversal. The standalone HTML applies one short entrance, skipped entirely when reduced motion is requested.</desc>
<g font-family="Archivo, Arial, sans-serif" font-variant-numeric="tabular-nums">
<rect width="100%" height="100%" fill="#0f1316"/>
<text x="64" y="64" font-size="28" font-weight="700" fill="#edf0ee" text-anchor="start">Whether</text><text x="1136" y="64" font-size="22" font-weight="400" fill="#a0a9a7" text-anchor="end">Template</text><text x="64" y="139" font-size="48" font-weight="700" fill="#edf0ee" text-anchor="start">[A decision worth sharing]</text><text x="64" y="184" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Template · one short entrance; immediate end state with reduced motion</text><rect x="64" y="247" width="1072" height="260" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="100" y="312" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Action now</text><text x="100" y="377" font-size="44" font-weight="600" fill="#edf0ee" text-anchor="start">[Write the bounded action]</text><text x="100" y="451" font-size="29" font-weight="400" fill="#cdd3d1" text-anchor="start">Revisit when [the agreed reversal condition holds].</text><line x1="64" y1="595" x2="1136" y2="595" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="64" y="636" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">Static information remains readable when animation is unavailable.</text><text x="1136" y="636" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="end">whether.work</text>
</g>
</svg>
