<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="dark-pause-resume-path-title dark-pause-resume-path-desc">
<title id="dark-pause-resume-path-title">Pause and resume decision path</title>
<desc id="dark-pause-resume-path-desc">Blank bounded decision template with separate branches for the agreed pause condition and the resume condition. Pause uses the canonical pause glyph and line ink; resume uses the canonical play glyph and neutral ink. Placeholders contain no current guidance.</desc>
<g font-family="Archivo, Arial, sans-serif" font-variant-numeric="tabular-nums">
<rect width="100%" height="100%" fill="#0f1316"/>
<text x="64" y="64" font-size="28" font-weight="700" fill="#edf0ee" text-anchor="start">Whether</text><text x="1136" y="64" font-size="22" font-weight="400" fill="#a0a9a7" text-anchor="end">Template</text><text x="64" y="139" font-size="48" font-weight="700" fill="#edf0ee" text-anchor="start">Agree the pause and the way back</text><text x="64" y="184" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Illustrative template · no current reading</text><rect x="350" y="245" width="500" height="128" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="600" y="319" font-size="34" font-weight="600" fill="#edf0ee" text-anchor="middle">Check the agreed lines</text><line x1="600" y1="373" x2="600" y2="414" stroke="#a0a9a7" stroke-width="2"/><line x1="303" y1="414" x2="897" y2="414" stroke="#a0a9a7" stroke-width="2"/><line x1="303" y1="414" x2="303" y2="465" stroke="#a0a9a7" stroke-width="2"/><line x1="897" y1="414" x2="897" y2="465" stroke="#a0a9a7" stroke-width="2"/><rect x="64" y="465" width="480" height="230" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f2685c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pause shrink-0 text-line-crossed-fg" data-concept-icon="line-state" data-line-state="crossed" aria-hidden="true" focusable="false" x="92" y="497"><rect x="14" y="3" width="5" height="18" rx="1"></rect><rect x="5" y="3" width="5" height="18" rx="1"></rect></svg><text x="151" y="528" font-size="30" font-weight="600" fill="#f2685c" text-anchor="start">Pause at the agreed line</text><text x="92" y="595" font-size="25" font-weight="400" fill="#cdd3d1" text-anchor="start">[Write the action to hold and</text><text x="92" y="630" font-size="25" font-weight="400" fill="#cdd3d1" text-anchor="start">the condition that trips it.]</text><rect x="656" y="465" width="480" height="230" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#edf0ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play shrink-0 text-line-clear-fg" data-concept-icon="line-state" data-line-state="clear" aria-hidden="true" focusable="false" x="684" y="497"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg><text x="743" y="528" font-size="29" font-weight="600" fill="#edf0ee" text-anchor="start">Resume when its line holds</text><text x="684" y="595" font-size="25" font-weight="400" fill="#cdd3d1" text-anchor="start">[Write what must be true before</text><text x="684" y="630" font-size="25" font-weight="400" fill="#cdd3d1" text-anchor="start">the action resumes.]</text><line x1="64" y1="770" x2="1136" y2="770" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="64" y="811" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">A pause and a resume can have different conditions.</text><text x="1136" y="811" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="end">whether.work</text>
</g>
</svg>
