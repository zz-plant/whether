<rect width="100%" height="100%" fill="#0f1316"/>
<rect x="1" y="1" width="558" height="142" rx="2" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><rect x="32" y="43" width="12" height="12" transform="rotate(45 38 49)" fill="none" stroke="#edf0ee" stroke-width="2"/><text x="62" y="60" font-size="30" font-weight="600" fill="#edf0ee" text-anchor="start">Cached snapshot</text><text x="28" y="113" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">Status label template</text>
</g>
</svg>
