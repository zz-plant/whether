<svg xmlns="http://www.w3.org/2000/svg" width="560" height="144" viewBox="0 0 560 144" role="img" aria-labelledby="dark-status-cached-title dark-status-cached-desc">
<title id="dark-status-cached-title">Cached snapshot label</title>
<desc id="dark-status-cached-desc">Cached snapshot status label template, shown in neutral ink. The caveat diamond qualifies cached and historical states; no current source health is asserted.</desc>
