ound" class="lucide lucide-pause shrink-0 text-line-crossed-fg" data-concept-icon="line-state" data-line-state="crossed" aria-hidden="true" focusable="false" x="776" y="317"><rect x="14" y="3" width="5" height="18" rx="1"></rect><rect x="5" y="3" width="5" height="18" rx="1"></rect></svg><text x="806" y="303" font-size="23" font-weight="600" fill="#f2685c" text-anchor="start">Pause 70</text><line x1="694" y1="351" x2="694" y2="404" stroke="#cdd3d1" stroke-width="3"/><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#edf0ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play shrink-0 text-line-clear-fg" data-concept-icon="line-state" data-line-state="clear" aria-hidden="true" focusable="false" x="682" y="317"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg><text x="676" y="303" font-size="23" font-weight="600" fill="#edf0ee" text-anchor="end">Resume 60</text><circle cx="806.8000000000001" cy="396" r="9" fill="#edf0ee" stroke="#0f1316" stroke-width="3"/><text x="806.8000000000001" y="474" font-size="24" font-weight="600" fill="#edf0ee" text-anchor="middle">Example 72</text><text x="80" y="555" font-size="26" font-weight="400" fill="#cdd3d1" text-anchor="start">Illustrative rule: pause above 70; resume below 60.</text><line x1="64" y1="620" x2="1136" y2="620" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="64" y="661" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">Illustrative example only; use your agreed lines and cited reading.</text><text x="1136" y="661" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="end">whether.work</text>
