<title id="dark-threshold-ladder-title">Pause and resume ladder</title>
<desc id="dark-threshold-ladder-desc">Illustrative threshold template on a 0–100 score scale. Example funding pressure is 72; pause above 70 and resume below 60. These values demonstrate layout and are not current guidance.</desc>
