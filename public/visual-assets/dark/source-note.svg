<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="dark-source-note-title dark-source-note-desc">
<title id="dark-source-note-title">Citable source note</title>
<desc id="dark-source-note-desc">Blank compact provenance template with placeholders for the reading, record date, retrieval time, source and readiness caveat. It asserts no actual source health or current values.</desc>
<g font-family="Archivo, Arial, sans-serif" font-variant-numeric="tabular-nums">
<rect width="100%" height="100%" fill="#0f1316"/>
<text x="64" y="64" font-size="28" font-weight="700" fill="#edf0ee" text-anchor="start">Whether</text><text x="1136" y="64" font-size="22" font-weight="400" fill="#a0a9a7" text-anchor="end">Template</text><text x="64" y="139" font-size="48" font-weight="700" fill="#edf0ee" text-anchor="start">A compact source note</text><text x="64" y="184" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Illustrative template · no current reading</text><text x="80" y="267" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Reading</text><text x="310" y="267" font-size="27" font-weight="400" fill="#cdd3d1" text-anchor="start">[Metric and value]</text><line x1="80" y1="291" x2="1120" y2="291" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="80" y="337" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Data as of</text><text x="310" y="337" font-size="27" font-weight="400" fill="#cdd3d1" text-anchor="start">[Record date]</text><line x1="80" y1="361" x2="1120" y2="361" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="80" y="407" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Checked</text><text x="310" y="407" font-size="27" font-weight="400" fill="#cdd3d1" text-anchor="start">[Retrieval time]</text><line x1="80" y1="431" x2="1120" y2="431" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="80" y="477" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Source</text><text x="310" y="477" font-size="27" font-weight="400" fill="#cdd3d1" text-anchor="start">[Source name and direct link]</text><line x1="80" y1="501" x2="1120" y2="501" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="80" y="547" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Readiness</text><text x="310" y="547" font-size="27" font-weight="400" fill="#cdd3d1" text-anchor="start">[Live, cached or historical; any limit]</text><line x1="80" y1="571" x2="1120" y2="571" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><line x1="64" y1="670" x2="1136" y2="670" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="64" y="711" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">Keep the record date distinct from the time a source was checked.</text><text x="1136" y="711" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="end">whether.work</text>
</g>
</svg>
