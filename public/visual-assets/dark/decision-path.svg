<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="dark-decision-path-title dark-decision-path-desc">
<title id="dark-decision-path-title">Signals to decision path</title>
<desc id="dark-decision-path-desc">Process template: read dated signals, name the conditions using the weekly call, choose an action calibrated to company constraints, set pause and resume lines, and share the cited artifact. It contains no current recommendation.</desc>
<g font-family="Archivo, Arial, sans-serif" font-variant-numeric="tabular-nums">
<rect width="100%" height="100%" fill="#0f1316"/>
<text x="64" y="64" font-size="28" font-weight="700" fill="#edf0ee" text-anchor="start">Whether</text><text x="1536" y="64" font-size="22" font-weight="400" fill="#a0a9a7" text-anchor="end">Template</text><text x="64" y="139" font-size="48" font-weight="700" fill="#edf0ee" text-anchor="start">From signals to a shareable decision</text><text x="64" y="184" font-size="24" font-weight="400" fill="#a0a9a7" text-anchor="start">Process template · use the existing brief and export flows</text><rect x="64" y="267" width="272" height="212" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="88" y="317" font-size="27" font-weight="600" fill="#edf0ee" text-anchor="start">Read the signals</text><text x="88" y="380" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Use the dated evidence.</text><text x="88" y="419" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Check source readiness.</text><line x1="343" y1="373" x2="358" y2="373" stroke="#a0a9a7" stroke-width="2"/><path d="M351 367l7 6-7 6" fill="none" stroke="#a0a9a7" stroke-width="2"/><rect x="364" y="267" width="272" height="212" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="388" y="317" font-size="27" font-weight="600" fill="#edf0ee" text-anchor="start">Name conditions</text><text x="388" y="380" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Use the weekly call.</text><text x="388" y="419" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Keep its exact wording.</text><line x1="643" y1="373" x2="658" y2="373" stroke="#a0a9a7" stroke-width="2"/><path d="M651 367l7 6-7 6" fill="none" stroke="#a0a9a7" stroke-width="2"/><rect x="664" y="267" width="272" height="212" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="688" y="317" font-size="27" font-weight="600" fill="#edf0ee" text-anchor="start">Choose the action</text><text x="688" y="380" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Use company constraints.</text><text x="688" y="419" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Name the next step.</text><line x1="943" y1="373" x2="958" y2="373" stroke="#a0a9a7" stroke-width="2"/><path d="M951 367l7 6-7 6" fill="none" stroke="#a0a9a7" stroke-width="2"/><rect x="964" y="267" width="272" height="212" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="988" y="317" font-size="27" font-weight="600" fill="#edf0ee" text-anchor="start">Set both lines</text><text x="988" y="380" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Say when to pause.</text><text x="988" y="419" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Say when to resume.</text><line x1="1243" y1="373" x2="1258" y2="373" stroke="#a0a9a7" stroke-width="2"/><path d="M1251 367l7 6-7 6" fill="none" stroke="#a0a9a7" stroke-width="2"/><rect x="1264" y="267" width="272" height="212" rx="10" fill="#171c20" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="1288" y="317" font-size="27" font-weight="600" fill="#edf0ee" text-anchor="start">Share the artifact</text><text x="1288" y="380" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Carry the cited reading.</text><text x="1288" y="419" font-size="21" font-weight="400" fill="#cdd3d1" text-anchor="start">Keep the decision visible.</text><text x="64" y="561" font-size="30" font-weight="600" fill="#edf0ee" text-anchor="start">Revisit when an agreed line is crossed or the evidence changes.</text><line x1="64" y1="640" x2="1536" y2="640" stroke="rgba(237, 240, 238, 0.10)" stroke-width="2"/><text x="64" y="681" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="start">Signals → posture → decision → artifact</text><text x="1536" y="681" font-size="20" font-weight="400" fill="#a0a9a7" text-anchor="end">whether.work</text>
</g>
</svg>
