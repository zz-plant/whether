<rect width="100%" height="100%" fill="#0c1511"/>
<rect x="1" y="1" width="558" height="142" rx="2" fill="#111b16" stroke="rgba(230, 236, 226, 0.13)" stroke-width="2"/><rect x="32" y="43" width="12" height="12" transform="rotate(45 38 49)" fill="none" stroke="#e6ece2" stroke-width="2"/><text x="62" y="60" font-size="30" font-weight="600" fill="#e6ece2" text-anchor="start">Historical snapshot</text><text x="28" y="113" font-size="20" font-weight="400" fill="#a3b2a9" text-anchor="start">Status label template</text>
</g>
</svg>
