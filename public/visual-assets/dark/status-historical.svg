<svg xmlns="http://www.w3.org/2000/svg" width="560" height="144" viewBox="0 0 560 144" role="img" aria-labelledby="dark-status-historical-title dark-status-historical-desc">
<title id="dark-status-historical-title">Historical snapshot label</title>
