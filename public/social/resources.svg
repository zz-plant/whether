    <text x="152" y="68" fill="#FFE4E6" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">CAPITAL DISCIPLINE</text>
    <text x="152" y="98" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Templates + briefs</text>
    <text x="152" y="124" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Citeable artifacts for boards,</text>
    <text x="152" y="146" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">ICs, and cross-functional reviews.</text>
    <rect x="44" y="244" width="328" height="116" rx="24" fill="#21151B" stroke="#8A4F5E"/>
    <text x="66" y="280" fill="#FECDD3" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">THIS WEEK BEFORE LONG-FORM</text>
    <text x="66" y="312" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Decision extract</text>
    <text x="66" y="338" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Action, pause trigger, and resume</text>
