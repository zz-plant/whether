  <text x="88" y="184" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700">Board-ready resource pack</text>
  <text x="88" y="238" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Templates, authority briefs, and shareable artifacts for leadership reviews.</text>
  <g transform="translate(686 112)">
    <rect x="0" y="0" width="420" height="404" rx="30" fill="#18131A" stroke="#74404A"/>
