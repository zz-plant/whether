  <text x="88" y="544" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Artifact quality matters. If it cannot be shared, it is not done.</text>
