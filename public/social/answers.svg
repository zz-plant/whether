  <text x="88" y="544" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">High-intent pages must resolve the question and route back to the weekly brief.</text>
