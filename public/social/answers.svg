  <text x="88" y="108" fill="#7DD3FC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="4">OPERATOR ANSWERS</text>
  <text x="88" y="184" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700">Answer first, then bound it</text>
  <text x="88" y="238" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Direct-answer pages tied to weekly posture, thresholds, and reversal conditions.</text>
  <g transform="translate(690 114)">
    <rect x="0" y="0" width="418" height="400" rx="30" fill="#0E1625" stroke="#31577B"/>
    <rect x="36" y="44" width="346" height="54" rx="27" fill="#112236" stroke="#38BDF8"/>
    <circle cx="70" cy="71" r="11" stroke="#7DD3FC" stroke-width="4"/>
    <path d="M79 80L90 91" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round"/>
    <text x="106" y="78" fill="#E0F2FE" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Should startups raise capital now?</text>
    <rect x="36" y="124" width="346" height="220" rx="24" fill="#101D2F" stroke="#36506E"/>
    <text x="58" y="164" fill="#7DD3FC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">DIRECT ANSWER</text>
    <text x="58" y="196" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Raise when it preserves</text>
    <text x="58" y="224" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">optionality and term quality.</text>
    <rect x="58" y="252" width="132" height="34" rx="17" fill="#082334" stroke="#2C6C8F"/>
    <text x="84" y="274" fill="#CFFAFE" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Pause trigger</text>
    <rect x="204" y="252" width="130" height="34" rx="17" fill="#13232E" stroke="#5C6E7E"/>
    <text x="235" y="274" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Resume line</text>
