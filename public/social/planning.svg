<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-ops" x1="76" y1="42" x2="1130" y2="608" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081118"/>
      <stop offset="0.55" stop-color="#0C1620"/>
      <stop offset="1" stop-color="#0E2028"/>
    </linearGradient>
    <radialGradient id="glow-ops" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(954 92) rotate(126.2) scale(440 296)">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg-ops)"/>
  <circle cx="954" cy="92" r="350" fill="url(#glow-ops)"/>
  <text x="88" y="108" fill="#67E8F9" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="4">OPERATIONS</text>
  <text x="88" y="184" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700">Approve this week&apos;s plan</text>
  <text x="88" y="238" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Translate posture into hiring, spend, and pacing guardrails with a share-ready brief.</text>
  <g transform="translate(684 112)">
    <rect x="0" y="0" width="426" height="404" rx="30" fill="#0D161E" stroke="#245B68"/>
    <text x="34" y="48" fill="#A5F3FC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2">WEEKLY PLAN</text>
    <rect x="34" y="74" width="358" height="74" rx="20" fill="#10242C" stroke="#268BA0"/>
    <text x="58" y="103" fill="#E0F2FE" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">START</text>
    <text x="58" y="130" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Push approved moves with bounded upside.</text>
    <rect x="34" y="168" width="358" height="74" rx="20" fill="#112028" stroke="#3A6E79"/>
    <text x="58" y="197" fill="#CFFAFE" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">FENCE</text>
    <text x="58" y="224" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Add approval gates for irreversible spend.</text>
    <rect x="34" y="262" width="358" height="74" rx="20" fill="#1B1F24" stroke="#8A5B4A"/>
    <text x="58" y="291" fill="#FED7AA" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">STOP</text>
    <text x="58" y="318" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Hold bets that break the pause trigger.</text>
    <rect x="232" y="352" width="160" height="38" rx="19" fill="#08262E" stroke="#2E778A"/>
    <text x="262" y="377" fill="#A5F3FC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Export brief</text>
  </g>
  <text x="88" y="544" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Guardrails first. Tool handoffs only after the weekly plan is approved.</text>
  <text x="1088" y="544" text-anchor="end" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Whether</text>
</svg>
