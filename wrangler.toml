name = "whether"
main = "./worker/index.ts"
compatibility_date = "2026-03-15"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = false
preview_urls = true

[assets]
binding = "ASSETS"
not_found_handling = "none"

[images]
binding = "IMAGES"

[vars]
NEXT_PUBLIC_SITE_URL = "https://whether.work"

[env.preview]
preview_urls = true

[env.preview.vars]
NEXT_PUBLIC_SITE_URL = "https://whether.work"

[env.preview.images]
binding = "IMAGES"
