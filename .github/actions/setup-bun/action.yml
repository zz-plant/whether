name: "Setup Bun"
description: "Bun at the repo's pinned version, the install cache, and a frozen install."
runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
