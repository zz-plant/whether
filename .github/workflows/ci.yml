name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["build", "build:cloudflare"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full project checks
        run: bun run check

      - name: Build Vercel output for Cloudflare reuse
        if: matrix.target == 'build:cloudflare'
        run: bunx vercel build

      - name: Run ${{ matrix.target }}
        env:
          NEXT_ON_PAGES_SKIP_BUILD: ${{ matrix.target == 'build:cloudflare' && '1' || '' }}
          NEXT_ON_PAGES_REUSE_PREBUILT: ${{ matrix.target == 'build:cloudflare' && '1' || '' }}
        run: bun run ${{ matrix.target }}
