name: CI

# Manual only. This repo is private, so Actions minutes are billed, and the account
# stopped paying for them: every automatic run since 2026-08-21 failed before its first
# step with "The job was not started because recent account payments have failed or your
# spending limit needs to be increased". A workflow that always fails is worse than no
# workflow — it teaches every reader to ignore a red check, including the ones that mean
# something. The gates moved to where they still run: .husky/pre-push for lint, typecheck,
# tests, assets, and the review hotspot preflight, and Cloudflare Workers Builds for the
# build and the deploy. Restore the push and pull_request triggers if the account starts
# paying for Actions again, or if this repo goes public — public repos get standard
# runners at no cost.
on:
  workflow_dispatch:

# A newer push to the same PR/branch supersedes the running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun

      # The task list is the `ci` preset in scripts/check-tasks.mjs, the same source the
      # local gates name theirs from, so this job cannot drift from what a push checks.
      - run: bun scripts/run-checks.mjs --preset ci

      # Absorbed from the former Upgrade Guardrails workflow. That job ran lint,
      # typecheck, and test as steps and then ran `check:vinext` -- which is
      # `bun run check`, i.e. the same three again -- before packaging the
      # Worker. Only the packaging was unique to it, so only the packaging
      # survives here. This also covers what the old `bun run build` step did.
      - name: Package Cloudflare Worker deploy
        run: |
          mkdir -p artifacts
          bun run deploy:cloudflare:dry-run 2>&1 | tee artifacts/cloudflare-deploy-dry-run.log

      - name: Upload Cloudflare build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-artifacts
          path: artifacts/

  # Manual like the job above; the note at the top of this file says why.
  screenshot-smoke:
    # Every render defect fixed in the Aug 2026 chart-integrity pass (fabricated
    # chart geometry, an axis-domain bug, dead props, a hardcoded light-theme
    # color) lived in the render layer and showed up in none of the 700+
    # logic-heavy tests above. This job renders the weekly brief (/) and
    # evidence (/signals) in a real browser and fails on any console error —
    # not a visual-diff gate, just UI standard VII's "console is clean" made
    # mechanical. Screenshots upload as artifacts for a human to actually look
    # at, which `check` cannot do.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - name: Start server
        run: |
          bun run start &
          echo $! > server.pid
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became reachable" >&2
          exit 1
      - run: bun run ci:screenshot-smoke
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-smoke
          path: artifacts/ui/
          if-no-files-found: ignore
