name: CI

# Manual only. This repo is private, so Actions minutes are billed, and the account
# stopped paying for them: every automatic run since 2026-08-21 failed before its first
# step with "The job was not started because recent account payments have failed or your
# spending limit needs to be increased". A workflow that always fails is worse than no
# workflow — it teaches every reader to ignore a red check, including the ones that mean
# something. The gates moved to where they still run: .husky/pre-push for lint, typecheck,
# tests, assets, and the review hotspot preflight, and Cloudflare Workers Builds for the
# build and the deploy. Restore the push and pull_request triggers if the account starts
# paying for Actions again, or if this repo goes public — public repos get standard
# runners at no cost.
on:
  workflow_dispatch:

# A newer push to the same PR/branch supersedes the running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      # lint/typecheck/test/assets are mutually independent; running them as
      # separate steps just added their durations together. This runs them
      # concurrently and reports every failure in one pass instead of stopping
      # at the first. Named explicitly so review:hotspot-preflight stays owned by
      # its own workflow, which needs a full-depth checkout.
      - run: bun scripts/run-checks.mjs lint typecheck test assets audit landmarks

      # Absorbed from the former Upgrade Guardrails workflow. That job ran lint,
      # typecheck, and test as steps and then ran `check:vinext` -- which is
      # `bun run check`, i.e. the same three again -- before packaging the
      # Worker. Only the packaging was unique to it, so only the packaging
      # survives here. This also covers what the old `bun run build` step did.
      - name: Package Cloudflare Worker deploy
        run: |
          mkdir -p artifacts
          bun run deploy:cloudflare:dry-run 2>&1 | tee artifacts/cloudflare-deploy-dry-run.log

      - name: Upload Cloudflare build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-artifacts
          path: artifacts/
