name: Weekly Brief Freeze

# Freezes the current week's brief to its permanent dated URL (/brief/YYYY-wWW).
# Opens a PR rather than committing directly: a published brief is a citable record,
# so a human confirms the snapshot before it becomes permanent.

# The Thursday 13:00 UTC cadence — after the Monday/Wednesday Treasury prints have
# settled — moved to a scheduled Claude Code routine when the account stopped paying for
# Actions minutes: "Whether — weekly brief freeze",
# https://claude.ai/code/routines/trig_01WrbhhT73Ve4bsFK83UNyu9
# This file stays runnable by hand for a missed week or a restored Actions budget. If both
# ever run, they open two PRs for the same week rather than colliding.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  freeze-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Freeze the current week
        id: freeze
        run: bun run brief:freeze

      - name: Verify the frozen record parses and routes
        run: bun run test tests/publishedBriefs.test.ts

      # Not continue-on-error: this step failed silently every week from at least
      # 2026-08-06, so the job stayed green while three frozen weeks were pushed to
      # a branch that no pull request ever pointed at. A freeze nobody can merge is
      # a failed freeze, and it should read as one.
      - name: Open pull request with the frozen week
        uses: peter-evans/create-pull-request@v7
        with:
          # One branch per week. The shared branch was reset on every run, so an
          # unmerged week was overwritten by the next -- weeks 32 and 33 of 2026
          # were frozen, pushed, and lost that way.
          branch: automation/weekly-brief-freeze-${{ steps.freeze.outputs.slug }}
          delete-branch: true
          title: "chore: freeze the ${{ steps.freeze.outputs.slug }} brief"
          commit-message: "chore: freeze weekly brief to its permanent dated URL"
          body: |
            ## Summary
            - Appends the current ISO week to `data/published_briefs.json`.
            - Publishes it at `/brief/<year>-w<week>` with a `datePublished` that never moves.

            ## Review before merging
            - The posture, thresholds, and evidence are frozen once merged. Corrections
              are published as a note on the page, not as a silent edit.
            - The freeze script refuses to run on a degraded snapshot, so a missing
              record here means live data was unavailable — not that nothing changed.

            ## Validation
            - `bun run brief:freeze`
            - `bun run test tests/publishedBriefs.test.ts`
          labels: |
            automation
            content
          add-paths: |
            data/published_briefs.json
