name: Weekly Brief Freeze

# Freezes the current week's brief to its permanent dated URL (/brief/YYYY-wWW).
# Opens a PR rather than committing directly: a published brief is a citable record,
# so a human confirms the snapshot before it becomes permanent.

on:
  schedule:
    # Thursday 13:00 UTC, after the Monday/Wednesday Treasury prints have settled.
    - cron: "0 13 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  freeze-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Freeze the current week
        run: bun run brief:freeze

      - name: Verify the frozen record parses and routes
        run: bun run test tests/publishedBriefs.test.ts

      - name: Open pull request with the frozen week
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/weekly-brief-freeze
          delete-branch: true
          title: "chore: freeze this week's brief"
          commit-message: "chore: freeze weekly brief to its permanent dated URL"
          body: |
            ## Summary
            - Appends the current ISO week to `data/published_briefs.json`.
            - Publishes it at `/brief/<year>-w<week>` with a `datePublished` that never moves.

            ## Review before merging
            - The posture, thresholds, and evidence are frozen once merged. Corrections
              are published as a note on the page, not as a silent edit.
            - The freeze script refuses to run on a degraded snapshot, so a missing
              record here means live data was unavailable — not that nothing changed.

            ## Validation
            - `bun run brief:freeze`
            - `bun run test tests/publishedBriefs.test.ts`
          labels: |
            automation
            content
          add-paths: |
            data/published_briefs.json
