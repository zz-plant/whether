name: SEO Refresh Queue

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-refresh-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SEO refresh queue artifact
        run: bun run seo:refresh-queue

      - name: Upload SEO refresh queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-refresh-queue
          path: |
            data/seo-refresh/queue.json
            data/seo-refresh/status.json
