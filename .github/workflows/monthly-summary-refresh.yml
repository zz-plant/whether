name: Monthly Summary Refresh

# The weekly cadence moved to a scheduled Claude Code routine when the account stopped paying
# for Actions minutes: "Whether — regime history refresh", Tuesday 12:00 UTC (Monday until
# 2026-10-06, when the account's weekly usage cap rejected it three weeks running),
# https://claude.ai/code/routines/trig_016331bnhHUZx2SWjWew2z5m
# Kept runnable by hand for a restored Actions budget or a one-off backfill.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-monthly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate monthly summaries
        run: bun scripts/generateMonthlySummaries.ts

      # Monthly generation alone leaves the quarterly/yearly archive behind: once
      # June 2026 landed, Q2 2026 was still missing, and
      # tests/summaryDerivedHistory.test.ts fails on exactly that drift.
      - name: Generate quarterly and yearly summaries
        run: bun scripts/generateQuarterlyYearlySummaries.ts

      # A refresh that produces data the suite rejects should not open a PR.
      - name: Verify refreshed data
        run: bun run test tests/summaryDerivedHistory.test.ts

      # No continue-on-error: this step failed every week from June to August 2026
      # with "GitHub Actions is not permitted to create or approve pull requests"
      # while the job kept reporting success, so the month rail silently froze at
      # May 2026. A refresh that cannot deliver its data is a failed refresh.
      - name: Open pull request with refreshed data
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/monthly-summary-refresh
          delete-branch: true
          title: "chore: refresh monthly summary data"
          commit-message: "chore: refresh monthly regime history with latest FRED data"
          body: |
            ## Summary
            - Regenerates monthly summaries from latest FRED Treasury yield curve data.
            - Updates `data/summary_monthly_regime_history.json` with tightness/riskAppetite scores.
            - Adds new months as FRED data becomes available.

            ## Validation
            - `bun scripts/generateMonthlySummaries.ts`
          labels: |
            automation
            data
          add-paths: |
            data/summary_archive.json
            data/summary_monthly_regime_history.json
            data/monthly_summaries_2012_2025.json
            data/time_machine_cache.json
            data/summary_memory_rail_weekly.json
