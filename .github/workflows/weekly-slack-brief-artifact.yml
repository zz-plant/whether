name: Weekly Slack Brief Artifact

# The Monday 13:00 UTC cadence moved to a scheduled Claude Code routine when the account
# stopped paying for Actions minutes: "Whether — weekly Slack brief refresh",
# https://claude.ai/code/routines/trig_017b1YkXqvsje8pseMXcUftp
# The routine cannot upload the artifacts/ text file — Actions artifacts have no equivalent
# there — so it commits only docs/briefs/latest-weekly-slack-brief.md and treats the text
# output as a generation check. Run this workflow by hand if you need the uploaded artifact.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate weekly Slack brief artifact
        run: bun run brief:weekly:artifact

      - name: Generate latest weekly Slack brief markdown
        run: bun scripts/generateWeeklySlackBrief.ts --out docs/briefs/latest-weekly-slack-brief.md --format markdown

      - name: Upload weekly Slack brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-slack-brief
          path: artifacts/weekly-slack-brief.txt

      # No continue-on-error, for the same reason as the sibling automations:
      # this step fails with "GitHub Actions is not permitted to create or approve
      # pull requests" while the job reports success, so the committed brief goes
      # stale with nothing to show for it.
      - name: Open pull request with latest weekly brief
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/weekly-slack-brief
          delete-branch: true
          title: "chore: refresh latest weekly Slack brief"
          commit-message: "chore: refresh latest weekly Slack brief"
          body: |
            ## Summary
            - Regenerates `docs/briefs/latest-weekly-slack-brief.md` from the latest weekly report data.
            - Keeps the downloadable Slack brief artifact current for operational handoff.

            ## Validation
            - `bun run brief:weekly:artifact`
            - `bun scripts/generateWeeklySlackBrief.ts --out docs/briefs/latest-weekly-slack-brief.md --format markdown`
          labels: |
            automation
            briefs
          add-paths: |
            docs/briefs/latest-weekly-slack-brief.md
