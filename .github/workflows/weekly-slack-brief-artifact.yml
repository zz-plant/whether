name: Weekly Slack Brief Artifact

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate weekly Slack brief artifact
        run: bun scripts/generateWeeklySlackBrief.ts --out artifacts/weekly-slack-brief.txt

      - name: Generate latest weekly Slack brief markdown
        run: bun scripts/generateWeeklySlackBrief.ts --out docs/briefs/latest-weekly-slack-brief.md --format markdown

      - name: Commit latest weekly Slack brief markdown
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/briefs/latest-weekly-slack-brief.md; then
            echo "Latest weekly Slack brief markdown is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/briefs/latest-weekly-slack-brief.md
          git commit -m "chore: refresh latest weekly Slack brief"
          git push

      - name: Upload weekly Slack brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-slack-brief
          path: artifacts/weekly-slack-brief.txt
