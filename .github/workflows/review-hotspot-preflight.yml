name: Review Hotspot Preflight

# Manual only, for the same billing reason as ci.yml. The preflight itself did not stop:
# .husky/pre-push runs it on every push, which is earlier than a pull request anyway. This
# file stays because the check wants a full-depth checkout that the local hook gets for
# free and a restored CI would need to ask for.
on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run review-hotspot preflight
        env:
          REVIEW_HOTSPOT_BASE: ${{ github.event.pull_request.base.sha || (github.event.created && '' || github.event.before) }}
        run: bun run review:hotspot-preflight
